name: Tests

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pqrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/pqrs_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/pqrs_test
      OPENAI_API_KEY: sk-test-fake-key-for-ci
      AI_PROVIDER: openai
      AI_MODEL_NAME: gpt-6-luna

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        working-directory: ./backend
        run: |
          python -c "
          import time, psycopg2, os
          for i in range(30):
              try:
                  psycopg2.connect(os.environ['DATABASE_URL'])
                  print('Postgres is ready!')
                  break
              except psycopg2.OperationalError:
                  time.sleep(1)
          else:
              print('Timed out')
              exit(1)
          "

      - name: Download spaCy model
        working-directory: ./backend
        run: python -m spacy download es_core_news_sm

      - name: Apply migrations
        working-directory: ./backend
        run: |
          alembic upgrade head
          alembic current

      - name: Run tests
        working-directory: ./backend
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false
