name: Tests

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pqrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/pqrs_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/pqrs_test_alt
      OPENAI_API_KEY: sk-test-fake-key-for-ci
      AI_PROVIDER: openai
      AI_MODEL_NAME: gpt-6-luna
      JWT_SECRET_KEY: ci-only-jwt-secret
      JWT_REFRESH_SECRET_KEY: ci-only-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        working-directory: ./backend
        run: |
          python -c "
          import time, psycopg, os
          url = os.environ['DATABASE_URL'].replace('+psycopg', '')
          for i in range(30):
              try:
                  psycopg.connect(url)
                  print('Postgres is ready!')
                  break
              except psycopg.OperationalError:
                  time.sleep(1)
          else:
              print('Timed out')
              exit(1)
          "

      - name: Create test-only database
        run: |
          PGPASSWORD=test psql -h localhost -U test -d pqrs_test -c "CREATE DATABASE pqrs_test_alt;"

      - name: Download spaCy model
        working-directory: ./backend
        run: python -m spacy download es_core_news_md

      - name: Apply migrations to test database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/pqrs_test_alt
        run: |
          alembic upgrade head
          alembic current

      - name: Run tests
        working-directory: ./backend
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: pqrs-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke-api \
            -e OPENAI_API_KEY=sk-fake \
            -e AI_MODEL_NAME=gpt-6-luna \
            -e AI_PROVIDER=openai \
            -e JWT_SECRET_KEY=ci-only-jwt-secret \
            -e JWT_REFRESH_SECRET_KEY=ci-only-refresh-secret \
            -e DATABASE_URL=postgresql+psycopg://user:pass@host:5432/db \
            -e TEST_DATABASE_URL=postgresql+psycopg://user:pass@host:5432/db \
            -p 8001:8000 \
            pqrs-api:ci
          echo "Waiting for container to become ready..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/ > /dev/null 2>&1; then
              echo "API is responding."
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8001/ || (docker logs smoke-api && exit 1)
          curl -fsS http://localhost:8001/health || (docker logs smoke-api && exit 1)
          docker stop smoke-api
          docker rm smoke-api